name: Build and deploy

on:
    push:
        branches: [main, feature/deployment-pipeline]
    # Enables manual trigger via Actions tab
    # Only available once this file exists on the default branch (main)
    workflow_dispatch:

# Permissions for GHCR
permissions:
    contents: read
    packages: write

jobs:
    build-backend:
        runs-on: ubuntu-latest
        steps:
            -
                name: Checkout repositoy
                # Clone the repository into the runner so following steps can access the source code
                # https://github.com/actions/checkout
                uses: actions/checkout@v7
            - 
                name: Login to GHCR
                # Authenticate against GitHub Container Registry using the auto-generated token
                # https://github.com/docker/login-action
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -
                name: Build and push backend image
                # Build the backend Docker image and push it to GHCR
                # https://github.com/docker/build-push-action
                uses: docker/build-push-action@v7
                with:
                    context: ./conduit-backend
                    push: true
                    # :latest is used by docker-compose.prod.yaml on the VM
                    # SHA tag provides an immutable reference for rollback
                    tags: |
                        ghcr.io/bjoerndaigger/conduit-backend:latest
                        ghcr.io/bjoerndaigger/conduit-backend:${{ github.sha }}


    build-frontend:
        runs-on: ubuntu-latest
        steps:
            -
                name: Checkout repositoy
                uses: actions/checkout@v7
            - 
                name: Login to GHCR
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -
                name: Build and push frontend image
                uses: docker/build-push-action@v7
                with:
                    context: ./conduit-frontend
                    build-args: |
                        API_URL=${{ vars.API_URL }}
                    push: true
                    tags: |
                        ghcr.io/bjoerndaigger/conduit-frontend:latest
                        ghcr.io/bjoerndaigger/conduit-frontend:${{ github.sha }}

    deploy:
        needs: [build-backend, build-frontend]   # waits for both builds
        runs-on: ubuntu-latest
        steps:
            -
                name: Checkout repositoy
                # Clone the repository into the runner so the compose file can be copied to the VM
                uses: actions/checkout@v7
            -
                name: Create .env file
                # Turn the secrets into a .env file the VM can read
                run: |
                    cat <<EOF > .env
                    POSTGRES_DB=${{ secrets.POSTGRES_DB }}
                    POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                    POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
                    POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
                    DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
                    DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}
                    DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
                    CORS_ORIGIN_WHITELIST=${{ secrets.CORS_ORIGIN_WHITELIST }}
                    DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
                    DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}
                    DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
                    EOF
            -
                name: Copy compose file and .env to VM
                # Copy docker-compose.prod.yaml and the generated .env to the target VM
                # https://github.com/appleboy/scp-action
                uses: appleboy/scp-action@v1
                with:
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USER }}
                    key: ${{ secrets.SSH_PRIVATE_KEY }}
                    source: "docker-compose.prod.yaml,.env"
                    target: "/home/${{ secrets.SSH_USER }}/projects/conduit-container"
            -
                name: SSH and deploy
                # Open an SSH connection to the VM, pull the new images and restart the containers
                # https://github.com/appleboy/ssh-action
                uses: appleboy/ssh-action@v1
                with:
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USER }}
                    key: ${{ secrets.SSH_PRIVATE_KEY }}
                    script: |
                        set -e
                        cd /home/${{ secrets.SSH_USER }}/projects/conduit-container
                        docker compose -f docker-compose.prod.yaml pull
                        docker compose -f docker-compose.prod.yaml up -d
                        # remove unused images to save disk space on the VM
                        docker image prune -f