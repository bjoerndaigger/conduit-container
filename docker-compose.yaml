services:
  database:
    image: postgres:13-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./conduit-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - static_data:/static

  frontend:
    build:
      context: ./conduit-frontend
      args:
        API_URL: ${API_URL}
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - backend

volumes:
  db_data:
  static_data: